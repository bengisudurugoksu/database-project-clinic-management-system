{% extends "base.html" %}
{% block title %}New Bill{% endblock %}
{% block page_title %}New Bill{% endblock %}

{% block content %}
<div class="card" style="max-width:600px">
  <div class="card-header bg-white">Create Bill</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Patient *</label>
          <select name="patient_id" id="patient_select" class="form-select" required>
            <option value="">— Select Patient —</option>
            {% for p in patients %}
            <option value="{{ p.patient_id }}">{{ p.first_name }} {{ p.last_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Appointment (optional)</label>
          <select name="appointment_id" id="appt_select" class="form-select">
            <option value="">— None (standalone bill) —</option>
            {% for a in appointments %}
            <option value="{{ a.appointment_id }}"
                    data-patient="{{ a.patient_id }}"
                    style="display:none">
              {{ a.appointment_date }} — {{ a.status }}
            </option>
            {% endfor %}
          </select>
          <div class="form-text text-muted" id="appt_hint">Select a patient first to see their appointments.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Amount ($) *</label>
          <input type="number" step="0.01" min="0" name="amount" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Payment Status</label>
          <select name="payment_status" class="form-select">
            <option value="unpaid">Unpaid</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create Bill</button>
          <a href="{{ url_for('billing.list_billing') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
document.getElementById('patient_select').addEventListener('change', function () {
  const pid = this.value;
  const apptSelect = document.getElementById('appt_select');
  const hint = document.getElementById('appt_hint');
  let visible = 0;

  apptSelect.value = '';
  apptSelect.querySelectorAll('option[data-patient]').forEach(opt => {
    const show = opt.dataset.patient === pid;
    opt.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  hint.textContent = pid
    ? (visible ? `${visible} unbilled appointment(s) available.` : 'No unbilled appointments for this patient.')
    : 'Select a patient first to see their appointments.';
});
</script>
{% endblock %}
