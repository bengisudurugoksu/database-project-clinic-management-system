{% extends "base.html" %}
{% block title %}Add Room{% endblock %}
{% block page_title %}Add Room{% endblock %}

{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header bg-white">New Room</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Room Number *</label>
          <input type="text" name="room_number" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Type *</label>
          <select name="room_type" class="form-select" required>
            {% for rt in ['General','ICU','Surgery','Emergency','Pediatric','Private'] %}
            <option value="{{ rt }}">{{ rt }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Capacity *</label>
          <input type="number" min="1" name="capacity" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Department</label>
          <select name="department_id" class="form-select">
            <option value="">— None —</option>
            {% for dept in departments %}
            <option value="{{ dept.department_id }}">{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Save Room</button>
          <a href="{{ url_for('rooms.list_rooms') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
