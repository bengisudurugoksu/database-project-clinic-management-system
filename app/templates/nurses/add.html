{% extends "base.html" %}
{% block title %}Add Nurse{% endblock %}
{% block page_title %}Add Nurse{% endblock %}

{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header bg-white">New Nurse</div>
  <div class="card-body">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">First Name *</label>
          <input type="text" name="first_name" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Last Name *</label>
          <input type="text" name="last_name" class="form-control" required>
        </div>
        <div class="col-12">
          <label class="form-label">Department</label>
          <select name="department_id" class="form-select">
            <option value="">— None —</option>
            {% for d in departments %}
            <option value="{{ d.department_id }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control">
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Add Nurse</button>
          <a href="{{ url_for('nurses.list_nurses') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
